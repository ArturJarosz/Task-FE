# Replaces the image's /etc/nginx/conf.d/default.conf
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # App routes like /projects/1/finance have no file behind them: serve index.html and let the Angular router take over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing file (a chunk from an older build, a wrong asset path) stays a 404 instead of getting index.html
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Every page ends up here, also through the fallback above. Browsers revalidate it on each load, so after a deploy
    # they never keep an index.html that points at the previous build's bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
