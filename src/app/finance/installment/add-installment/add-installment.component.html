<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">New installment</span>
            <span class="text-sm text-gray-500">Add the client payment for a stage that doesn't have one yet.</span>
        </div>
    </ng-template>
    <form [formGroup]="addInstallmentForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="sm:col-span-2">
            <label for="addInstallmentStage" class="app-form-label">Stage <span class="text-error-600">*</span></label>
            <p-select inputId="addInstallmentStage" formControlName="stageId" [options]="stagesWithoutInstallment"
                      optionLabel="name" optionValue="id" placeholder="Select a stage"
                      emptyMessage="Every stage already has an installment" appendTo="body" [fluid]="true"/>
            @if (stagesWithoutInstallment.length === 0) {
                <small class="block mt-1.5 text-xs text-gray-500">Every stage already has an installment. Add a stage first.</small>
            } @else {
                <small class="block mt-1.5 text-xs text-gray-500">Only stages without an installment are listed</small>
            }
        </div>
        <app-installment-payment-fields class="sm:col-span-2" [form]="addInstallmentForm" idPrefix="addInstallment"/>
        <div class="sm:col-span-2">
            <label for="addInstallmentNote" class="app-form-label">Note</label>
            <textarea id="addInstallmentNote" formControlName="note" pTextarea rows="3" [autoResize]="true" class="w-full"></textarea>
        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create installment" icon="pi pi-plus" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
