<finance-component-summary [financeComponentDataForm]="installmentsDetailForm">
    <div wrapper-list>
        <p-table [value]="installments" [tableStyle]="{'min-width': '40rem'}">
            <ng-template #header>
                <tr>
                    <th>For</th>
                    <th>Payment date</th>
                    <th class="app-num">Value</th>
                    <th class="w-24 text-center">Invoice</th>
                    <th class="w-24 text-center">Paid</th>
                </tr>
            </ng-template>
            <ng-template #body let-installment>
                <tr [routerLink]="['/projects', projectId, 'installments', installment.id]" class="cursor-pointer">
                    <td>
                        <span class="font-medium text-gray-800">{{ isDeposit(installment) ? 'Deposit' : installment.stageName }}</span>
                    </td>
                    <td>
                        @if (installment.paymentDate) {
                            <span>{{ installment.paymentDate | date:'dd.MM.yyyy' }}</span>
                        } @else {
                            <app-not-set/>
                        }
                    </td>
                    <td class="app-num">{{ installment.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="installment.hasInvoice" label="Invoice"/></td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="installment.paid" label="Paid"/></td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <app-empty-state icon="pi pi-credit-card" title="No installments yet" text="Add the deposit and one installment per stage to track client payments."/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
