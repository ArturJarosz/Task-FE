<finance-component-summary [financeComponentDataForm]="installmentsDetailForm">
    <div wrapper-list>
        <p-table [value]="installmentProjectData.installments ?? []" [tableStyle]="{'min-width': '40rem'}">
            <ng-template pTemplate="header">
                <tr>
                    <th>Stage</th>
                    <th>Payment date</th>
                    <th class="app-num">Value</th>
                    <th class="w-24 text-center">Invoice</th>
                    <th class="w-24 text-center">Paid</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-installment>
                <tr [routerLink]="['/projects', projectId, 'installments', installment.id]" class="cursor-pointer">
                    <td class="font-medium text-gray-800">{{ installment.stageName }}</td>
                    <td>
                        <span *ngIf="installment.paymentDate; else notSet">{{ installment.paymentDate | date:'dd.MM.yyyy' }}</span>
                    </td>
                    <td class="app-num">{{ installment.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><i *ngIf="installment.hasInvoice; else no" class="pi pi-check-circle text-success-700" aria-label="Invoice: yes"></i></td>
                    <td class="w-24 text-center"><i *ngIf="installment.paid; else no" class="pi pi-check-circle text-success-700" aria-label="Paid: yes"></i></td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <app-empty-state icon="pi pi-credit-card" title="No installments yet" text="Add one installment per stage to track client payments."/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>

<ng-template #no><span class="text-gray-400" aria-label="No">—</span></ng-template>

<ng-template #notSet><span class="text-gray-400">Not set</span></ng-template>
