<finance-component-summary [financeComponentDataForm]="installmentsDetailForm" addLabel="Add installment" (add)="add.emit()">
    <div wrapper-list>
        <p-table [value]="(installments) | sortRows:sort:sortValue"
             [lazy]="true" [lazyLoadOnInit]="false" (onLazyLoad)="onSort($event)" tableStyleClass="sm:min-w-[40rem]" styleClass="app-table-phone">
            <ng-template #header>
                <tr>
                    <th pSortableColumn="for">For <p-sortIcon field="for"/></th>
                    <th pSortableColumn="paymentDate">Payment date <p-sortIcon field="paymentDate"/></th>
                    <th pSortableColumn="value" class="app-num">Net value <p-sortIcon field="value"/></th>
                    <th pSortableColumn="hasInvoice" class="w-24 text-center">Invoice <p-sortIcon field="hasInvoice"/></th>
                    <th pSortableColumn="paid" class="w-24 text-center">Paid <p-sortIcon field="paid"/></th>
                </tr>
            </ng-template>
            <ng-template #body let-installment>
                <tr [routerLink]="['/projects', projectId, 'installments', installment.id]" tabindex="-1" class="cursor-pointer">
                    <td>
                        <a [routerLink]="['/projects', projectId, 'installments', installment.id]" class="app-row-link font-medium text-gray-800"
                           (click)="$event.stopPropagation()">{{ isDeposit(installment) ? 'Deposit' : installment.stageName }}</a>
                    </td>
                    <td>
                        @if (installment.paymentDate) {
                            <span>{{ installment.paymentDate | date:'dd.MM.yyyy' }}</span>
                        } @else {
                            <app-not-set/>
                        }
                    </td>
                    <td class="app-num">{{ installment.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="installment.hasInvoice" label="Invoice"/></td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="installment.paid" label="Paid"/></td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <app-empty-state icon="pi pi-credit-card" title="No installments yet" text="Add the deposit and one installment per stage to track client payments."/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
