<wrapper [title]="installment?.stageName!">
    <div wrapper-body>
        <p-accordion [multiple]="true">
            <p-accordionTab [selected]="true" header="Installment details" class="text-900 font-medium">
                <form [formGroup]="installmentDetailForm">
                    <div class="p-2">
                        <div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
                        </div>
                        <div class="grid grid-nogutter surface-border  p-1">
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Stage name</div>
                                <div class="col-8 pr-3">
                                    <input formControlName="stageName" id="stageName" pInputText>
                                </div>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Paid</div>
                                <div class="col-8 pr-3">
                                    <p-inputSwitch formControlName="paid" id="paid"></p-inputSwitch>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-nogutter surface-border  p-1 ">
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Value</div>
                                <div class="col-8 pr-3">
                                    <input formControlName="value" id="value" pInputText>
                                </div>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Has Invoice</div>
                                <div class="col-8 pr-3">
                                    <p-inputSwitch formControlName="hasInvoice" id="hasInvoice"></p-inputSwitch>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </p-accordionTab>
        </p-accordion>
    </div>
    <div wrapper-buttons>

    </div>
</wrapper>
