<div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
    <p-button title="Add new installment" icon="pi pi-plus" (onClick)="onClickAdd()" [rounded]="true" class="add-button transition-colors transition-duration-300"></p-button>
</div>
<div class="pt-2">
    <installment-list
            [installmentProjectData]="$installmentProjectData()"
    ></installment-list>
</div>
<add-installment
        [visible]="showAddCostComponent"
        [stages]="$stages()"
        [stagesWithoutInstallmentIds]="$installmentProjectData().stagesWithoutInstallment!"
        (notify)="onNotify($event)">
</add-installment>
