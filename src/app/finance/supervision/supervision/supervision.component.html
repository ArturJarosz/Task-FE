@if (supervision) {
    <div class="px-6 pb-4">
        <dl class="m-0 grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-px overflow-hidden rounded-xl border border-gray-200 bg-gray-200">
            @for (stat of stats; track stat.label) {
                <div class="bg-gray-50 px-4 py-3">
                    <dt class="text-xs text-gray-500">{{ stat.label }}</dt>
                    <dd class="m-0 mt-1 text-base font-semibold text-gray-800 tabular-nums whitespace-nowrap">
                        {{ stat.money ? ((stat.value ?? 0) | currency:'PLN':'symbol':'1.2-2') : (stat.value ?? 0) }}
                    </dd>
                </div>
            }
        </dl>
    </div>
    <!-- Under the figures, right above the table it adds to -->
    <div class="flex flex-wrap items-center justify-end gap-4 px-6 pb-4">
        <p-button label="Add visit" icon="pi pi-plus" (onClick)="onAddVisitClick()"/>
    </div>
    <p-table [value]="(supervisionVisits) | sortRows:sort:sortValue"
             [lazy]="true" [lazyLoadOnInit]="false" (onLazyLoad)="onSort($event)" tableStyleClass="sm:min-w-[30rem]" styleClass="app-table-phone">
        <ng-template #header>
            <tr>
                <th pSortableColumn="dateOfVisit">Date of visit <p-sortIcon field="dateOfVisit"/></th>
                <th pSortableColumn="hoursCount" class="app-num">Hours <p-sortIcon field="hoursCount"/></th>
                <th pSortableColumn="payable" class="w-24 text-center">Payable <p-sortIcon field="payable"/></th>
            </tr>
        </ng-template>
        <ng-template #body let-visit>
            <tr [routerLink]="['/projects', projectId, 'supervision', supervisionId, 'visits', visit.id]" tabindex="-1" class="cursor-pointer">
                <td class="font-medium text-gray-800"><a [routerLink]="['/projects', projectId, 'supervision', supervisionId, 'visits', visit.id]" class="app-row-link" (click)="$event.stopPropagation()">{{ visit.dateOfVisit | date:'dd.MM.yyyy' }}</a></td>
                <td class="app-num">{{ visit.hoursCount }}</td>
                <td class="w-24 text-center">
                    <app-yes-no-mark [value]="visit.payable" label="Payable"/>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="3" class="p-0">
                    <app-empty-state icon="pi pi-calendar" title="No visits yet" text="Record each supervision visit to bill its hours."/>
                </td>
            </tr>
        </ng-template>
    </p-table>
} @else {
    <app-empty-state icon="pi pi-eye" title="No supervision yet" text="Add author's supervision to track its rates and visits.">
        <p-button label="Add supervision" icon="pi pi-plus" (onClick)="onAddSupervisionClick()"/>
    </app-empty-state>
}
