<p-dialog header="Add Supervision" [(visible)]="visible" appendTo="body" [modal]="true"
          [style]="{ width: '50vw', 'max-width': '800px'}"
          (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-2">
            <h1 class="m-0 text-surface-900 dark:text-surface-0 font-semibold leading-normal">{{ header }}</h1>
        </div>
    </ng-template>
    <form [formGroup]="addSupervisionForm">
        <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
            <div class="flex gap-4">
                <div class="w-4/12">
                    <label for="baseNetValue" class="block text-color text-base top-label">Base rate</label>
                    <p-inputNumber formControlName="baseNetValue" id="baseNetValue" mode="decimal"
                                   [minFractionDigits]="2" [maxFractionDigits]="2"
                                   styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                </div>
                <div class="w-4/12">
                    <label for="visitNetRate" class="block text-color text-base top-label">Visit rate</label>
                    <p-inputNumber formControlName="visitNetRate" id="visitNetRate" mode="decimal"
                                   [minFractionDigits]="2" [maxFractionDigits]="2"
                                   styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                </div>
                <div class="w-4/12">
                    <label for="hourlyNetRate" class="block text-color text-base top-label">Hourly rate</label>
                    <p-inputNumber formControlName="hourlyNetRate" id="hourlyNetRate" mode="decimal"
                                   [minFractionDigits]="2" [maxFractionDigits]="2"
                                   styleClass="w-full" inputStyleClass="w-full"></p-inputNumber>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
            <div class="flex gap-4">
                <div class="w-6/12">
                    <label for="hasInvoice" class="block text-color text-base top-label">Has invoice</label>
                    <p-toggleSwitch formControlName="hasInvoice" id="hasInvoice"></p-toggleSwitch>
                </div>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex gap-4 justify-end border-t border-surface pt-8">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined" [disabled]="!isSaveEnabled()"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
