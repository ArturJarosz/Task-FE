<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">New supervision</span>
            <span class="text-sm text-gray-500">Set the net rates for the author's supervision of this project.</span>
        </div>
    </ng-template>
    <form [formGroup]="addSupervisionForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="sm:col-span-2">
            <label for="addSupervisionBaseRate" class="app-form-label">Base rate <span class="text-error-600">*</span></label>
            <p-inputnumber inputId="addSupervisionBaseRate" formControlName="baseNetValue" mode="decimal" locale="pl-PL"
                           [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0" suffix=" zł" [fluid]="true"/>
            <small class="block mt-1.5 text-xs text-gray-500">Net fee for the whole supervision</small>
        </div>
        <div>
            <label for="addSupervisionVisitRate" class="app-form-label">Visit rate <span class="text-error-600">*</span></label>
            <p-inputnumber inputId="addSupervisionVisitRate" formControlName="visitNetRate" mode="decimal" locale="pl-PL"
                           [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0" suffix=" zł" [fluid]="true"/>
            <small class="block mt-1.5 text-xs text-gray-500">Net fee per visit</small>
        </div>
        <div>
            <label for="addSupervisionHourlyRate" class="app-form-label">Hourly rate <span class="text-error-600">*</span></label>
            <p-inputnumber inputId="addSupervisionHourlyRate" formControlName="hourlyNetRate" mode="decimal" locale="pl-PL"
                           [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0" suffix=" zł" [fluid]="true"/>
            <small class="block mt-1.5 text-xs text-gray-500">Net fee per hour of a visit</small>
        </div>
        <div class="flex items-center gap-3">
            <p-toggleswitch inputId="addSupervisionHasInvoice" formControlName="hasInvoice"/>
            <label for="addSupervisionHasInvoice" class="text-sm font-medium text-gray-700 cursor-pointer">Has invoice</label>
        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create supervision" icon="pi pi-plus" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
