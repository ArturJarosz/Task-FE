<p-dialog header="Add Supervision" [(visible)]="visible" appendTo="body" [modal]="true"
          [style]="{ width: '50vw', 'max-width': '800px'}"
          (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-2">
            <h1 class="m-0 text-surface-900 dark:text-surface-0 font-semibold leading-normal">{{ header }}</h1>
        </div>
    </ng-template>
    <form [formGroup]="addSupervisionForm">
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="md:col-span-4 p-1">
                <div class="text-surface-500 dark:text-surface-300 font-medium">Base Rate</div>
                <p-inputNumber formControlName="baseNetValue" id="baseNetValue" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
            </div>
            <div class="md:col-span-4 p-1">
                <div class="text-surface-500 dark:text-surface-300 font-medium">Visit Rate</div>
                <p-inputNumber formControlName="visitNetRate" id="visitNetRate" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
            </div>
            <div class="md:col-span-4 p-1">
                <div class="text-surface-500 dark:text-surface-300 font-medium">Hourly Rate</div>
                <p-inputNumber formControlName="hourlyNetRate" id="hourlyNetRate" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="md:col-span-4 p-1">
                <div class="text-surface-500 dark:text-surface-300 font-medium">Has Invoice</div>
                <p-toggleSwitch formControlName="hasInvoice" id="hasInvoice"></p-toggleSwitch>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex gap-4 justify-end border-t border-surface pt-8">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
