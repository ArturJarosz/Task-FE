<div class="flex flex-col lg:flex-row lg:justify-end items-center justify-end">
    <p-button title="Add new contractor job" icon="pi pi-plus" (onClick)="onClickAdd()" [rounded]="true" class="add-button transition-colors duration-300"></p-button>
</div>
<div class="pt-2">
    <contractor-job-list
            [projectId]="projectId"
            [contractors]="$contractors()"
            [contractorsJobsProjectData]="$contractorsJobsProjectData()">
    </contractor-job-list>
</div>
<add-contractor-job
        [visible]="showAddContractorJobDialog"
        (notify)="onNotify()">

</add-contractor-job>
