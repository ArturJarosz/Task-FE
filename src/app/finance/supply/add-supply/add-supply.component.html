<p-dialog header="header" [(visible)]="visible" appendTo="body" [modal]="true"
          [style]="{ width: '50vw', 'max-width': '800px'}"
          (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-column gap-2">
            <h1 class="m-0 text-900 font-semibold line-height-3">{{ header }}</h1>
        </div>
    </ng-template>
    <form [formGroup]="addSupplyForm">
        <div class="grid grid-nogutter surface-border p-1">
            <div class="md:col-4 p-1">
                <label for="name" class="block  text-color text-base">Supply name</label>
                <span class="p-input-icon-left w-full">
                    <input type="text" class="w-full" id="name" formControlName="name" pInputText placeholder="supply name"
                           [ngClass]="{'is-invalid': (addSupplyForm.get('name')?.touched || addSupplyForm.get('name')?.dirty) && !addSupplyForm.get('name')?.valid }"/>
                </span>
            </div>
            <div class="md:col-4 p-1">
                <label for="supplier" class="block  text-color text-base">Supplier</label>
                <span class="p-input-icon-left w-full">
                    <p-dropdown [options]="$suppliers()" optionLabel="name" optionValue="id"
                                formControlName="supplierId" class="w-full" appendTo="body" id="supplier">
                    </p-dropdown>
                </span>
            </div>
            <div class="md:col-4 p-1">
                <label for="paid" class="block  text-color text-base">Paid</label>
                <span class="p-input-icon-left w-full">
                    <p-inputSwitch formControlName="paid" id="paid"></p-inputSwitch>
                </span>
            </div>
        </div>
        <div class="grid grid-nogutter surface-border p-1 ">
            <div class="md:col-4 p-1">
                <div class="text-500 font-medium">Value</div>
                <p-inputNumber formControlName="value" id="value" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
            </div>
            <div class="md:col-4 p-1">
                <div class="text-500 font-medium ">Has Invoice</div>
                <p-inputSwitch formControlName="hasInvoice" id="hasInvoice"></p-inputSwitch>
            </div>
        </div>
        <div class="grid grid-nogutter surface-border p-1 ">
            <div class="md:col-8 p-1">
                <div class="text-500 font-medium  h-2rem">Note</div>
                <textarea formControlName="note" id="note" type="text" pInputTextarea rows="2"
                          [autoResize]="true" style="height: 4rem;overflow: hidden;"></textarea>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex gap-3 justify-content-end border-top-1 surface-border pt-5">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined" [disabled]="!isSaveEnabled()"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
