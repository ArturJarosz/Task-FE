<div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
    <p-button title="Add new supply" icon="pi pi-plus" (onClick)="onClickAdd()" [rounded]="true" class="add-button transition-colors transition-duration-300"></p-button>
</div>
<div class="pt-2">
    <supply-list
            [suppliers]="$suppliers()"
            [supplyProjectData]="$supplyProjectData()">
    </supply-list>
</div>
<add-supply
    [visible]="showAddSupplierComponent"
    (notify)="onNotify($event)"
>
</add-supply>
