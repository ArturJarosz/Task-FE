<financial-item-detail
    [item]="$item()" [loadFailed]="$supplyLoadFailed()"
    [labels]="labels"
    [partners]="$suppliers()"
    [projectId]="projectId"
    [projectName]="$projectName()"
    (updateEvent)="updateSupply($event)"
    (deleteEvent)="deleteSupply($event)" (reloadEvent)="onReload()">
</financial-item-detail>
<p-confirmdialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
