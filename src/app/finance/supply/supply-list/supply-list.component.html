<finance-component-summary [financeComponentDataForm]="supplyDataForm">
    <div wrapper-list>
        <p-table [value]="supplyProjectData?.supplies ?? []" [tableStyle]="{'min-width': '44rem'}">
            <ng-template #header>
                <tr>
                    <th>Name</th>
                    <th>Supplier</th>
                    <th class="app-num">Value</th>
                    <th class="w-24 text-center">Invoice</th>
                    <th class="w-24 text-center">Paid</th>
                </tr>
            </ng-template>
            <ng-template #body let-supply>
                <tr [routerLink]="['/projects', projectId, 'supplies', supply.id]" class="cursor-pointer">
                    <td class="font-medium text-gray-800">{{ supply.name }}</td>
                    <td>{{ supplierIdToSupplier.get(supply.supplierId) }}</td>
                    <td class="app-num">{{ supply.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="supply.hasInvoice" label="Invoice"/></td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="supply.paid" label="Paid"/></td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <app-empty-state icon="pi pi-truck" title="No supplies yet" text="Add materials bought from suppliers for this project."/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
