<finance-component-summary [financeComponentDataForm]="supplyDataForm">
    <div wrapper-list>
        <p-table [value]="supplyProjectData?.supplies!" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Supplier</th>
                    <th>Value</th>
                    <th class="max-w-4rem text-center">Invoice</th>
                    <th class="max-w-4rem text-center">Paid</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-supply>
                <tr [routerLink]="['/projects', projectId, 'supplies', supply.id]" class="cursor-pointer">
                    <td>{{ supply.name }}</td>
                    <td>{{ this.supplierIdToSupplier.get(supply.supplierId) }}</td>
                    <td>{{ supply.value | currency: ' ':'code':'2.2-2' }}</td>
                    <td class="max-w-4rem text-center">
                        <i *ngIf="supply.hasInvoice" class="pi pi-check"></i>
                        <i *ngIf="!supply.hasInvoice" class="pi pi-times"></i>
                    </td>
                    <td class="max-w-4rem text-center">
                        <i *ngIf="supply.paid" class="pi pi-check"></i>
                        <i *ngIf="!supply.paid" class="pi pi-times"></i>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
