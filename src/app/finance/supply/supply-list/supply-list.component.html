<finance-component-summary [financeComponentDataForm]="supplyDataForm" addLabel="Add supply" (add)="add.emit()">
    <div wrapper-list>
        <p-table [value]="(supplyProjectData?.supplies ?? []) | sortRows:sort:sortValue"
             [lazy]="true" [lazyLoadOnInit]="false" (onLazyLoad)="onSort($event)" tableStyleClass="sm:min-w-[44rem]" styleClass="app-table-phone">
            <ng-template #header>
                <tr>
                    <th pSortableColumn="name">Name <p-sortIcon field="name"/></th>
                    <th pSortableColumn="supplier">Supplier <p-sortIcon field="supplier"/></th>
                    <th pSortableColumn="value" class="app-num">Net value <p-sortIcon field="value"/></th>
                    <th pSortableColumn="hasInvoice" class="w-24 text-center">Invoice <p-sortIcon field="hasInvoice"/></th>
                    <th pSortableColumn="paid" class="w-24 text-center">Paid <p-sortIcon field="paid"/></th>
                </tr>
            </ng-template>
            <ng-template #body let-supply>
                <tr [routerLink]="['/projects', projectId, 'supplies', supply.id]" class="cursor-pointer">
                    <td class="font-medium text-gray-800">{{ supply.name }}</td>
                    <td>{{ supplierIdToSupplier.get(supply.supplierId) }}</td>
                    <td class="app-num">{{ supply.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="supply.hasInvoice" label="Invoice"/></td>
                    <td class="w-24 text-center"><app-yes-no-mark [value]="supply.paid" label="Paid"/></td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <app-empty-state icon="pi pi-truck" title="No supplies yet"/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
