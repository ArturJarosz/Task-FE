<finance-component-summary [financeComponentDataForm]="supplyDataForm">
    <div wrapper-list>
        <p-table [value]="supplyProjectData?.supplies ?? []" [tableStyle]="{'min-width': '44rem'}">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Supplier</th>
                    <th class="omcd-num">Value</th>
                    <th class="w-24 text-center">Invoice</th>
                    <th class="w-24 text-center">Paid</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-supply>
                <tr [routerLink]="['/projects', projectId, 'supplies', supply.id]" class="cursor-pointer">
                    <td class="font-medium text-gray-800">{{ supply.name }}</td>
                    <td>{{ supplierIdToSupplier.get(supply.supplierId) }}</td>
                    <td class="omcd-num">{{ supply.value | currency:'PLN':'symbol':'1.2-2' }}</td>
                    <td class="w-24 text-center"><i *ngIf="supply.hasInvoice; else no" class="pi pi-check-circle text-success-700" aria-label="Invoice: yes"></i></td>
                    <td class="w-24 text-center"><i *ngIf="supply.paid; else no" class="pi pi-check-circle text-success-700" aria-label="Paid: yes"></i></td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td [attr.colspan]="5" class="p-0">
                        <omcd-empty-state icon="pi pi-truck" title="No supplies yet" text="Add materials bought from suppliers for this project."/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>

<ng-template #no><span class="text-gray-400" aria-label="No">—</span></ng-template>
