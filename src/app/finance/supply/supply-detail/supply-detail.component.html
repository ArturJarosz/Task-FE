<wrapper [title]="'Supply - ' + (supply?.name)">
    <div wrapper-body>
        <p-accordion [multiple]="true">
            <p-accordionTab [selected]="true" header="Supply details" class="text-900 font-medium">
                <form [formGroup]="supplyDetailForm">
                    <div class="p-2">
                        <div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
                            <p-button icon="pi pi-arrow-down" [disabled]="!isFormChanged()" (onClick)="onSave()" [outlined]="true" [rounded]="true" class="update-button transition-colors transition-duration-300"></p-button>
                            <p-button icon="pi pi-times" [outlined]="true" [rounded]="true" (onClick)="onDelete()" class="remove-button transition-colors px-1"></p-button>
                        </div>
                        <div class="grid grid-nogutter surface-border p-1">
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Name</div>
                                <div class="col-8 pr-3">
                                    <input type="text" class="w-full" formControlName="name" pInputText placeholder="supply name"/>
                                </div>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Supplier</div>
                                <div class="col-8 pr-3">
                                    <p-select [options]="suppliers" optionLabel="name" optionValue="id"
                                                formControlName="supplierId" class="w-full" appendTo="body">
                                    </p-select>
                                </div>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Value</div>
                                <div class="col-8 pr-3">
                                    <p-inputNumber formControlName="value" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-nogutter surface-border p-1">
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Has Invoice</div>
                                <p-toggleSwitch formControlName="hasInvoice"></p-toggleSwitch>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Paid</div>
                                <p-toggleSwitch formControlName="paid"></p-toggleSwitch>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Payment Date</div>
                                <p-datePicker formControlName="paymentDate" id="paymentDate" dateFormat="yy-mm-dd"></p-datePicker>
                            </div>
                        </div>
                        <div class="grid grid-nogutter surface-border p-1">
                            <div class="md:col-8 p-1">
                                <div class="text-500 font-medium">Note</div>
                                <div class="col-8 pr-3">
                                    <textarea formControlName="note" type="text" pInputTextarea rows="2"
                                              [autoResize]="true" style="height: 4rem;overflow: hidden;"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </p-accordionTab>
        </p-accordion>
    </div>
    <div wrapper-buttons>
    </div>
</wrapper>
