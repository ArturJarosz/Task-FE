<finance-component-summary [financeComponentDataForm]="projectCostsSummaryForm">
    <div wrapper-list>
        <p-table [value]="projectCostsData.costs!" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Value</th>
                    <th class="max-w-16 text-center">Invoice</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-cost>
                <tr [routerLink]="['/projects', projectId, 'costs', cost.id]" class="cursor-pointer">
                    <td>{{ cost.name }}</td>
                    <td>{{ getCostCategoryLabel(cost.category) }}</td>
                    <td>{{ cost.date }}</td>
                    <td>{{ cost.value | currency: ' ':'code':'2.2-2' }}</td>
                    <td class="max-w-16 text-center">
                        <i *ngIf="cost.hasInvoice" class="pi pi-check"></i>
                        <i *ngIf="!cost.hasInvoice" class="pi pi-times"></i>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

</finance-component-summary>
