<div class="flex flex-wrap items-center justify-between gap-4 px-6 pb-4">
    <p class="m-0 text-sm text-gray-500">Fuel, mistakes and other costs of this project</p>
    <p-button label="Add cost" icon="pi pi-plus" (onClick)="onClickAdd()"/>
</div>
<div>
    <cost-list
            [projectId]="projectId"
            [costCategories]="$costCategories()"
            [projectCostsData]="$projectCostsData()">
    </cost-list>
</div>
<add-cost
        [visible]="showAddCostComponent"
        (notify)="onNotify($event)"
></add-cost>
