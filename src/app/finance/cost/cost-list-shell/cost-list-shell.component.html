<div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
    <p-button title="Add new cost" icon="pi pi-plus" (onClick)="onClickAdd()" [rounded]="true" class="add-button transition-colors transition-duration-300"></p-button>
</div>
<div class="pt-2">
    <cost-list
            [projectId]="projectId"
            [costCategories]="$costCategories()"
            [projectCostsData]="$projectCostsData()">
    </cost-list>
</div>
<add-cost
        [visible]="showAddCostComponent"
        [projectId]="projectId"
        (notify)="onNotify($event)"
></add-cost>
