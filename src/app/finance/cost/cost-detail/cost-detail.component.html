<wrapper [title]="cost?.name!">
    <div wrapper-body>
        <p-accordion [multiple]="true">
            <p-accordionTab [selected]="true" header="Cost details" class="text-900 font-medium">
                <form [formGroup]="costDetailsForm">
                    <div class="p-2">
                        <div class="flex flex-column lg:flex-row lg:justify-content-end align-items-center justify-content-end">
                            <p-button title="Update cost" icon="pi pi-arrow-down" [disabled]="!isFormChanged()" (onClick)="onSave()" [outlined]="true" [rounded]="true" class="update-button transition-colors transition-duration-300"></p-button>
                        </div>
                        <div class="grid grid-nogutter surface-border p-1">
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Name</div>
                                <input formControlName="name" id="name" pInputText class="w-full">
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium">Category</div>
                                <p-select [options]="costCategories!" optionLabel="label" optionValue="id"
                                            formControlName="category" class="w-full" styleClass="w-full">
                                </p-select>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Value</div>
                                <p-inputNumber formControlName="value" id="value" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2" styleClass="w-full"></p-inputNumber>
                            </div>
                        </div>
                        <div class="grid grid-nogutter surface-border  p-1 ">
                            <div class="md:col-2 p-1">
                                <div class="text-500 font-medium ">Has Invoice</div>
                                <p-toggleSwitch formControlName="hasInvoice" id="hasInvoice"></p-toggleSwitch>
                            </div>
                            <div class="md:col-2 p-1">
                                <div class="text-500 font-medium ">Paid</div>
                                <p-toggleSwitch formControlName="paid" id="paid"></p-toggleSwitch>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Date</div>
                                <p-datePicker formControlName="date" id="date" dateFormat="yy-mm-dd"></p-datePicker>
                            </div>
                            <div class="md:col-4 p-1">
                                <div class="text-500 font-medium ">Payment Date</div>
                                <p-datePicker formControlName="paymentDate" id="paymentDate" dateFormat="yy-mm-dd"></p-datePicker>
                            </div>
                        </div>
                        <div class="grid grid-nogutter surface-border  p-1 ">
                            <div class="md:col-12 p-1">
                                <div class="text-500 font-medium ">Note</div>
                                <textarea formControlName="note" id="note" type="text" pInputTextarea rows="2"
                                          [autoResize]="true" class="w-full"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </p-accordionTab>
        </p-accordion>
    </div>
    <div wrapper-buttons>

    </div>
</wrapper>
