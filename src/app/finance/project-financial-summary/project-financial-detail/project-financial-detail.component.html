<div class="flex flex-col gap-6">
    <!-- Financial summary -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
        <section *ngFor="let kpi of kpis" class="app-card p-6">
            <div class="app-kpi-icon"><i [class]="kpi.icon + ' text-xl'"></i></div>
            <div class="mt-5 app-kpi-label">{{ kpi.label }}</div>
            <div class="mt-2 app-kpi-value">{{ (kpi.value ?? 0) | currency:'PLN':'symbol':'1.2-2' }}</div>
        </section>
    </div>

    <!-- Financial components -->
    <section class="app-card overflow-hidden">
        <div class="app-card-header">
            <div>
                <h3 class="app-card-title">Financial components</h3>
                <p class="app-card-subtitle m-0">Costs, payments and work billed to this project</p>
            </div>
            <nav class="app-seg" aria-label="Financial components">
                <a *ngFor="let tab of tabs" class="app-seg-item" [class.active]="tab.key === selectedTab"
                   [routerLink]="[]" [queryParams]="{tab: tab.key}" queryParamsHandling="merge">{{ tab.label }}</a>
            </nav>
        </div>
        <div *ngIf="projectId && costs" [ngSwitch]="selectedTab">
            <cost-list-shell *ngSwitchCase="'costs'" [projectId]="projectId" [costs]="costs"></cost-list-shell>
            <installment-list-shell *ngSwitchCase="'installments'"></installment-list-shell>
            <supply-list-shell *ngSwitchCase="'supplies'" [projectId]="projectId"></supply-list-shell>
            <contractor-job-list-shell *ngSwitchCase="'contractorJobs'" [projectId]="projectId"></contractor-job-list-shell>
            <supervision-shell *ngSwitchCase="'supervision'" [projectId]="projectId"></supervision-shell>
        </div>
    </section>
</div>
