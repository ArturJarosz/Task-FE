<section class="app-card overflow-hidden">
    <div class="app-card-header">
        <div>
            <h2 class="app-card-title">Stages</h2>
            <p class="app-card-subtitle m-0">Phases of the work, each with its own deadline and payment</p>
        </div>
        <p-button label="Add stage" icon="pi pi-plus" (onClick)="onAddStage()"/>
    </div>
    <stage-list
            [stages]="stages"
            [projectId]="projectId"
            [stageStatuses]="$stageStatuses()"
            [stageTypes]="$stageTypes()"
            [architects]="$architects()"
            (deleteStageEvent)="onDelete($event)">
    </stage-list>
</section>
<add-stage
        [visible]="showAddStageComponent"
        [projectId]="projectId"
        (addStageNotify)="onNotify($event)">
</add-stage>
