<p-dialog
        header="header"
        [(visible)]="visible"
        appendTo="body"
        [modal]="true"
        [style]="{ width: '50vw', 'max-width': '100vw', 'min-width': '40vw'}"
        (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-2">
            <h1 class="m-0 text-surface-900 dark:text-surface-0 font-semibold leading-normal">{{ header }}</h1>
        </div>
    </ng-template>
    <form [formGroup]="addStageForm">
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Name:</div>
                <span class="col-span-8 pr-4">
                    <input type="text" id="name" formControlName="name" pInputText placeholder="stage name"
                           [ngClass]="{'is-invalid': (addStageForm.get('name')?.touched || addStageForm.get('name')?.dirty) && !addStageForm.get('name')?.valid }"/>
                </span>
            </div>
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Type:</div>
                <p-select class="col-span-8 pr-4" [options]="$stageTypes()" optionLabel="label" optionValue="id"
                            formControlName="type" appendTo="body" id="type">
                </p-select>
            </div>
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Architect:</div>
                <p-select class="col-span-8 pr-4" [options]="$architects()" optionLabel="firstName" optionValue="id"
                            formControlName="architectId" appendTo="body" id="architect">
                    <ng-template pTemplate="selectedItem" let-architect>
                        <span>{{architect.firstName}} {{architect.lastName}}</span>
                    </ng-template>
                    <ng-template pTemplate="item" let-architect>
                        <span>{{architect.firstName}} {{architect.lastName}}</span>
                    </ng-template>
                </p-select>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Deadline:</div>
                <p-datePicker class="col-span-8 pr-4" formControlName="deadline" id="deadline" dateFormat="yy-mm-dd"></p-datePicker>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="md: p-1 p-1 w-full">
                <div class="text-surface-500 dark:text-surface-300 font-medium h-8">Note</div>
                <textarea formControlName="note" id="note" type="text" pInputTextarea rows="2"
                          [autoResize]="true" style="height: 4rem;overflow: hidden;"></textarea>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-6 text-surface-500 dark:text-surface-300 font-medium">Installment</div>
                <p-toggleSwitch formControlName="hasInstallment" class="col-span-6" id="hasInstallment"></p-toggleSwitch>
            </div>
        </div>
        <div *ngIf="addStageForm.get('hasInstallment')?.value!" class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Value:</div>
                <p-inputNumber formControlName="installmentValue" id="installmentValue" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"></p-inputNumber>
            </div>
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Has invoice:</div>
                <p-toggleSwitch formControlName="hasInvoice" class="col-span-8 pr-4" id="hasInvoice"></p-toggleSwitch>
            </div>
        </div>
        <div *ngIf="addStageForm.get('hasInstallment')?.value!" class="grid grid-cols-12 gap-4 border-surface p-1">
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Paid:</div>
                <p-toggleSwitch formControlName="paid" class="col-span-8 pr-4" id="paid"></p-toggleSwitch>
            </div>
            <div class="col-span-4 p-1 grid grid-cols-12 gap-4" *ngIf="addStageForm.get('paid')?.value!">
                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Payment date:</div>
                <p-datePicker class="col-span-8 pr-4" formControlName="paymentDate" id="paymentDate" dateFormat="yy-mm-dd" appendTo="body"></p-datePicker>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex gap-4 justify-end border-t border-surface pt-8">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined" [disabled]="!isSaveEnabled()"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
