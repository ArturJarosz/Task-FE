<omcd-page-header title="Clients" [crumbs]="crumbs"/>

<div class="flex flex-col gap-6">
    <!-- KPIs -->
    <div class="grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-6">
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-users text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">Clients</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().clients }}</div>
            </div>
        </section>
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-briefcase text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">With active projects</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().withActiveProjects }}</div>
            </div>
        </section>
    </div>

    <!-- Table card -->
    <section class="omcd-card overflow-hidden">
        <div class="omcd-card-header">
            <div>
                <h2 class="omcd-card-title">All clients</h2>
                <p class="omcd-card-subtitle m-0">{{ $kpis().clients }} {{ $kpis().clients === 1 ? 'client' : 'clients' }}</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <div class="omcd-seg" role="group" aria-label="Filter by client type">
                    <button *ngFor="let segment of segments" type="button" class="omcd-seg-item gap-2"
                            [class.active]="segment.key === $segmentKey()" [attr.aria-pressed]="segment.key === $segmentKey()"
                            (click)="onSelectSegment(segment.key)">
                        {{ segment.label }}
                        <span class="text-xs text-gray-400 tabular-nums">{{ $segmentCounts()[segment.key] }}</span>
                    </button>
                </div>
                <p-button label="New client" icon="pi pi-plus" (onClick)="onAddClient()"/>
            </div>
        </div>
        <client-list [rows]="$pagedRows()"
                     [clientTypes]="$clientTypes()"
                     [emptyTitle]="$emptyTitle()"
                     [emptyText]="$emptyText()"
                     (removeClientEvent)="onDeleteClient($event)">
        </client-list>
        <omcd-table-footer [total]="$filteredRows().length" [page]="$page()" [pageSize]="pageSize"
                           (pageChange)="$page.set($event)"/>
    </section>
</div>

<p-confirmDialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
<add-client [visible]="showAddClient" (notify)="onAddClientClosed()"></add-client>
