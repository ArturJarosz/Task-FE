<p-dialog closeAriaLabel="Close" [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">New client</span>
        </div>
    </ng-template>
    <form [formGroup]="clientForm">
        <client-form-fields [form]="clientForm" [clientTypes]="$clientTypes()"/>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create client" icon="pi pi-plus" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
