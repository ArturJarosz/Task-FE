<financial-report-view
        [financialReport]="$financialReport()"
        [startDate]="$startDate()"
        [endDate]="$endDate()"
        [periodType]="$periodType()"
        [loading]="$loading()"
        [loadFailed]="$loadFailed()"
        (dateRangeChange)="onDateRangeChange($event)"
        (periodTypeChange)="onPeriodTypeChange($event)"
        (reloadReport)="onReload()">
</financial-report-view>
