<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">New project</span>
            <span class="text-sm text-gray-500">Add the project, its client, architect and contract value.</span>
        </div>
    </ng-template>
    <form [formGroup]="addProjectForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
            <label for="name" class="app-form-label">Project name <span class="text-error-600">*</span></label>
            <input id="name" type="text" formControlName="name" pInputText class="w-full" placeholder="e.g. Lublin 02"
                   (blur)="markAsDirty('name')"/>
            @if (isFieldInvalid('name')) {
                <small class="block mt-1.5 text-xs text-error-600">Enter a project name</small>
            }
        </div>
        <div>
            <label for="type" class="app-form-label">Type <span class="text-error-600">*</span></label>
            <p-select inputId="type" formControlName="type" [options]="$projectTypes()"
                      optionLabel="label" optionValue="id" appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="client" class="app-form-label">Client <span class="text-error-600">*</span></label>
            <p-select inputId="client" formControlName="clientId" [options]="$clientsForm()"
                      optionLabel="resolvedName" optionValue="id" [filter]="true" filterBy="resolvedName"
                      appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="architect" class="app-form-label">Architect <span class="text-error-600">*</span></label>
            <p-select inputId="architect" formControlName="architectId" [options]="$architectsModel()"
                      optionLabel="resolvedName" optionValue="id" [filter]="true" filterBy="resolvedName"
                      appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="offerValue" class="app-form-label">Contract value <span class="text-error-600">*</span></label>
            <p-inputnumber inputId="offerValue" formControlName="offerValue" mode="decimal" locale="pl-PL"
                           [minFractionDigits]="2" [maxFractionDigits]="2" [min]="0" suffix=" zł" [fluid]="true"
                           (onBlur)="markAsDirty('offerValue')"/>
            @if (isFieldInvalid('offerValue')) {
                <small class="block mt-1.5 text-xs text-error-600">Enter the contract value</small>
            }
        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create project" icon="pi pi-plus" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
