<p-dialog header='header' [(visible)]="visible" appendTo="body" [modal]="true"
          [style]="{ width: '50vw', 'max-width': '800px'}"
          (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-2">
            <h1 class="m-0 text-surface-900 dark:text-surface-0 font-semibold leading-normal">{{header}}</h1>
        </div>
    </ng-template>
    <div>
        <form [formGroup]="addProjectForm">
            <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
                <div class="flex gap-4">
                    <div class="w-6/12">
                        <label for="name" class="block text-color text-base top-label">Project name</label>
                        <span class="p-input-icon-left w-full">
                            <input type="text" class="w-full" id="name" formControlName="name"
                                   pInputText placeholder="project name"
                                   [ngClass]="{'is-invalid': (addProjectForm.get('name')?.touched || addProjectForm.get('name')?.dirty) && !addProjectForm.get('name')?.valid }"
                            />
                        </span>
                    </div>
                    <div class="w-6/12">
                        <label for="type" class="block text-color text-base top-label">Type</label>
                        <span class="w-full">
                            <p-select [options]="$projectTypes()" optionLabel="label" optionValue="id"
                                        formControlName="type" class="w-full" appendTo="body" id="type">
                            </p-select>
                        </span>
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
                <div class="flex gap-4">
                    <div class="w-6/12">
                        <label for="client" class="block text-color text-base w-full top-label">Client</label>
                        <p-select [options]="$clientsForm()" optionLabel="resolvedName" optionValue="id"
                                    formControlName="clientId" class="w-full" appendTo="body" id="client">
                        </p-select>
                    </div>
                    <div class="w-6/12">
                        <label for="architect" class="block text-color text-base w-full top-label">Architect</label>
                        <p-select [options]="$architectsModel()!" optionLabel="resolvedName" optionValue="id"
                                    formControlName="architectId" class="w-full" appendTo="body" id="architect">
                        </p-select>
                    </div>
                </div>
            </div>
            <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
                <div class="flex gap-4">
                    <div class="w-full">
                        <label for="offerValue" class="block text-color text-base top-label">Value</label>
                        <span class="p-input-icon-left w-full">
                                <input type=number step=0.01 class="w-full" id="offerValue" formControlName="offerValue"
                                       pInputText
                                       placeholder="0.0"
                                       [ngClass]="{'is-invalid': (addProjectForm.get('offerValue')?.touched || addProjectForm.get('offerValue')?.dirty) && !addProjectForm.get('offerValue')?.valid }"
                                />
                        </span>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <ng-template pTemplate="footer">
        <div class="flex gap-4 justify-end border-t border-surface pt-8">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined" [disabled]="!isSaveEnabled()"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
