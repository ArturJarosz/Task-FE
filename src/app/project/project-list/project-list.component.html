<p-table [value]="projects!" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 5rem">Architect</th>
            <th>Name</th>
            <th></th>
            <th>Type</th>
            <th>Client</th>
            <th>Status</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-project>
        <tr [routerLink]="['/projects', project.id]" class="cursor-pointer">
            <td class="text-center">
                <p-avatar styleClass="mr-2" [label]="getArchitectInitials(project.architect)" shape="circle" styleClass="bg-primary text-white" [pTooltip]="getArchitectName(project.architect)" tooltipPosition="top"></p-avatar>
            </td>
            <td>{{ project.name}}</td>
            <td>
                <button pButton pRipple class="p-button-text p-button-plain p-0" icon="pi pi-times" (click)="deleteProject($event, project.name, project.id)" size="small"></button>
            </td>
            <td>{{ getProjectTypeLabel(project.type) }}</td>
            <td>{{ getClientName(project.client) }}</td>
            <td>{{ getProjectStatusLabel(project.status) }}</td>
        </tr>
    </ng-template>
</p-table>
