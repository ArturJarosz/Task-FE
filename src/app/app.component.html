<div class="min-h-screen flex flex-col bg-surface-100 dark:bg-surface-950">
    <p-toast [life]="12000"></p-toast>
    <div class="p-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a pRipple class="cursor-pointer inline-flex items-center justify-center text-surface-700 dark:text-surface-100" (click)="toggleSidebar()">
                <i class="pi pi-bars text-2xl"></i>
            </a>
            <img src="assets/images/logo.svg" alt="Image" class="h-10">
        </div>
        <ul class="list-none p-0 m-0 flex items-center select-none">
            <li *ngIf="(authorizationService.isAuthenticated() | async) === true">
                <p-avatar [label]="getUserInitial()" shape="circle" styleClass="cursor-pointer bg-primary text-white" (click)="toggleUserMenu($event)"></p-avatar>
                <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" (onShow)="alignUserMenuRight()"></p-menu>
            </li>
        </ul>
    </div>
    <div class="flex relative lg:static p-6 flex-auto">
        <div id="app-sidebar" [ngClass]="sidebarCollapsed ? 'w-16' : 'w-[250px]'" class="bg-surface-0 dark:bg-surface-900 shrink-0 absolute lg:static left-0 top-0 z-10 select-none shadow-md rounded-xl border border-surface-200 overflow-hidden transition-all duration-300">
            <div class="flex flex-col h-full">
                <div class="overflow-y-auto">

                    <ul class="list-none px-4 pb-4 pt-0 m-0" >
                        <li>
                            <div class="p-4 flex items-center justify-between text-surface-600 dark:text-surface-200">
                                <span *ngIf="!sidebarCollapsed" class="font-medium text-sm text-surface-900 dark:text-surface-0">MENU</span>
                            </div>
                            <ul class="list-none p-0 m-0 overflow-hidden">
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Dashboard" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/home'">
                                        <i class="pi pi-home" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Dashboard</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Projects" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/projects'">
                                        <i class="pi pi-file-edit" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Projects</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Architects" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/architects'">
                                        <i class="pi pi-users" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Architects</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Clients" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/clients'">
                                        <i class="pi pi-users" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Clients</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Contractors" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/contractors'">
                                        <i class="pi pi-users" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Contractors</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Suppliers" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/suppliers'">
                                        <i class="pi pi-users" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Suppliers</span>
                                    </a>
                                </li>
                                <li [routerLinkActive]="['active', 'bg-primary-50', 'text-primary-700', 'border-primary-500', 'border-right-2']">
                                    <a pRipple pTooltip="Financial Report" tooltipPosition="right" [tooltipDisabled]="!sidebarCollapsed" class="flex items-center cursor-pointer p-4 text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors border-r-2 border-transparent" [ngClass]="{'justify-center': sidebarCollapsed}" [routerLink]="'/financial-report'">
                                        <i class="pi pi-chart-bar" [ngClass]="{'mr-2': !sidebarCollapsed}"></i>
                                        <span *ngIf="!sidebarCollapsed" class="font-medium">Financial Report</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="flex flex-col flex-auto">
            <div class="flex-auto lg:ml-6">
                <div class="mb-4">
                    <p-breadcrumb class="max-w-full" [model]="breadcrumbItems">
                        <ng-template pTemplate="item" let-item>
                            <ng-container *ngIf="item.route; else elseBlock">
                                <a [routerLink]="item.route" class="p-menuitem-link">
                                    <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
                                    <span class="text-primary font-semibold">{{ item.label }}</span>
                                </a>
                            </ng-container>
                            <ng-template #elseBlock>
                                <a [href]="item.url">
                                    <span class="text-color">{{ item.label }}</span>
                                </a>
                            </ng-template>
                        </ng-template>
                    </p-breadcrumb>
                </div>
                <div>
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
