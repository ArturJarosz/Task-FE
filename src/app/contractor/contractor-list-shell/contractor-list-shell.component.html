<app-page-header title="Contractors" [crumbs]="crumbs"/>

<div class="flex flex-col gap-gutter">
    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-gutter">
        <app-kpi-card icon="pi pi-wrench" label="Contractors">{{ $kpis().total }}</app-kpi-card>
        <app-kpi-card icon="pi pi-briefcase" label="With jobs">{{ $kpis().withItems }}</app-kpi-card>
        <app-kpi-card icon="pi pi-list" label="Jobs">{{ $kpis().items }}</app-kpi-card>
        <app-kpi-card icon="pi pi-tags" label="Trades">{{ $kpis().categories }}</app-kpi-card>
    </div>

    <!-- Table card -->
    <section class="app-card overflow-hidden">
        <div class="app-card-header">
            <div>
                <h2 class="app-card-title">All contractors</h2>
                <p class="app-card-subtitle m-0">{{ $kpis().total }} {{ $kpis().total === 1 ? 'contractor' : 'contractors' }}</p>
            </div>
            <p-button label="New contractor" icon="pi pi-plus" (onClick)="onAdd()"/>
        </div>
        <app-partner-list [rows]="$pagedRows()" routeBase="/contractors" entityLabel="contractor" countLabel="Jobs"
                           icon="pi pi-wrench" emptyText="Add the electricians, plumbers and other trades you work with."
                           (deleteEvent)="onDelete($event)" (sortChange)="onSortChange($event)"/>
        <app-table-footer [total]="$rows().length" [page]="$page()" [pageSize]="pageSize"
                           (pageChange)="$page.set($event)"/>
    </section>
</div>

<p-confirmdialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
<add-contractor [visible]="showAdd" (notify)="onAddClosed()"></add-contractor>
