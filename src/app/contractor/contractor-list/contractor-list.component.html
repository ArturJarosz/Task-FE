<wrapper [title]="pageTitle">
    <div wrapper-body>
        <p-table [value]="contractors" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th></th>
                    <th>Category</th>
                    <th class="max-w-16 text-center">Jobs</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-contractor>
                <tr [routerLink]="['/contractors', contractor.id]" class="cursor-pointer">
                    <td>{{ contractor.id }}</td>
                    <td>
                        <div class="flex items-center gap-2">
                            <p-avatar [label]="getContractorInitials(contractor.name)" shape="circle" styleClass="bg-primary text-white"></p-avatar>
                            <span>{{ contractor.name }}</span>
                        </div>
                    </td>
                    <td>
                        <button pButton pRipple class="p-button-text p-button-plain p-0" icon="pi pi-times" (click)="onDeleteContractor($event, contractor)" size="small"></button>
                    </td>
                    <td>{{ getLabelFromCategory(contractor.category) }}</td>
                    <td class="max-w-16 text-center">{{ contractor.numberOfContractorJobs }}</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
    <div wrapper-buttons>
        <p-button icon="pi pi-plus" (click)="onClick()" [rounded]="true" class="add-button transition-colors duration-300"></p-button>
    </div>
    <add-contractor [visible]="showAddContractorComponent" (notify)="onNotify($event)"></add-contractor>
</wrapper>
