<p-dialog header="header" [(visible)]="visible" appendTo="body" [modal]="true"
          [style]="{ width: '50vw', 'max-width': '800px'}"
          (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-2">
            <h1 class="m-0 text-surface-900 dark:text-surface-0 font-semibold leading-normal">{{ header }}</h1>
        </div>
    </ng-template>
    <form [formGroup]="addContractorForm">
        <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
            <div class="flex gap-4">
                <div class="w-6/12">
                    <label for="name" class="block text-color text-base top-label">Name</label>
                    <span class="p-input-icon-left w-full">
                        <input type="text" class="w-full" id="name" formControlName="name" pInputText placeholder="Contractor name"
                               [ngClass]="{'is-invalid': (addContractorForm.get('name')?.touched || addContractorForm.get('name')?.dirty) && !addContractorForm.get('name')?.valid }"/>
                    </span>
                </div>
                <div class="w-6/12">
                    <label for="category" class="block text-color text-base top-label">Type</label>
                    <p-select [options]="$contractorTypes()" optionLabel="label" optionValue="id"
                              formControlName="category" class="w-full" appendTo="body" id="category">
                    </p-select>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
            <div class="flex gap-4">
                <div class="w-6/12">
                    <label for="email" class="block text-color text-base top-label">Email</label>
                    <span class="p-input-icon-left w-full">
                        <input type="text" class="w-full" id="email" formControlName="email"
                               pInputText
                               placeholder="email"
                        />
                    </span>
                </div>
                <div class="w-6/12">
                    <label for="telephone" class="block text-color text-base top-label">Phone</label>
                    <span class="p-input-icon-left w-full">
                        <input type="text" formControlName="telephone" class="w-full" id="telephone"
                               pInputText
                               placeholder="telephone"
                        />
                    </span>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-4 mt-4 border-t border-surface pt-2">
            <div class="w-full">
                <label for="note" class="block text-color text-base top-label">Note</label>
                <textarea rows="5" pInputTextarea type="text" formControlName="note"
                          class="w-full" id="note"
                          placeholder="note"
                ></textarea>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex gap-4 justify-end border-t border-surface pt-8">
            <p-button label="Cancel" styleClass="p-button-outlined p-button-secondary"
                      (onClick)="onCancel()"></p-button>
            <p-button label="Save" styleClass="p-button-outlined" [disabled]="!isSaveEnabled()"
                      (onClick)="onSave()"></p-button>
        </div>
    </ng-template>
</p-dialog>
