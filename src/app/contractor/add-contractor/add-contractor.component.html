<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">{{ header }}</span>
            <span class="text-sm text-gray-500">Add a contractor with their trade and contact details.</span>
        </div>
    </ng-template>
    <form [formGroup]="addContractorForm">
        <omcd-partner-form-fields [form]="addContractorForm" [categories]="$contractorTypes()" namePlaceholder="e.g. Kowalski Elektryka"/>
    </form>
    <ng-template pTemplate="footer">
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create contractor" icon="pi pi-plus" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
