<finance-component-summary
        [hasAveragedData]="true"
        [financeComponentDataForm]="contractorJobsSummaryForm"
        [averageFinanceComponentDataForm]="averageContractorJobsSummaryForm">

    <div wrapper-list>
        <p-table [value]="contractorJobsData.contractorJobs!" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Name</th>
                    <th>Project Name</th>
                    <th>Value</th>
                    <th class="max-w-4rem text-center">Invoice</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-contractorJob>
                <tr>
                    <td>{{ contractorJob.name }}</td>
                    <td>{{ this.projectNameById.get(contractorJob.projectId) }}</td>
                    <td>{{ contractorJob.value | currency: ' ':'code':'2.2-2' }}</td>
                    <td class="max-w-4rem text-center">
                        <i *ngIf="contractorJob.hasInvoice" class="pi pi-check"></i>
                        <i *ngIf="!contractorJob.hasInvoice" class="pi pi-times"></i>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</finance-component-summary>
