<dashboard [report]="$report()"
           [periodType]="$periodType()"
           [reportLoading]="$reportLoading()"
           [reportLoadFailed]="$reportLoadFailed()"
           [projects]="projects"
           [projectsLoadFailed]="$projectsLoadFailed()"
           [projectTypes]="$projectTypes()"
           [projectStatuses]="$projectStatuses()"
           [activeProjectStatuses]="$activeProjectStatuses()"
           [upcomingEvents]="$upcomingEvents()"
           (periodTypeChange)="onPeriodTypeChange($event)"
           (reloadReport)="onReloadReport()"
           (reloadProjects)="onReloadProjects()"/>
