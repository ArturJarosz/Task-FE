<dashboard [report]="$report()"
           [periodType]="$periodType()"
           [reportLoading]="$reportLoading()"
           [reportLoadFailed]="$reportLoadFailed()"
           [projects]="projects"
           [projectsLoadFailed]="$projectsLoadFailed()"
           [projectTypes]="$projectTypes()"
           [projectStatuses]="$projectStatuses()"
           [activeProjectStatuses]="$activeProjectStatuses()"
           [upcomingEvents]="$upcomingEvents()"
           [upcomingEventsShown]="systemParameterStore.upcomingEventsShown()"
           [googleSyncIssue]="calendarStore.googleSyncIssue()"
           [googleSyncChecking]="calendarStore.googleConnectionChecking()"
           [layout]="$layout()"
           [draftLayout]="$draftLayout()"
           [layoutLoading]="$layoutLoading()"
           [layoutSaving]="$layoutSaving()"
           (periodTypeChange)="onPeriodTypeChange($event)"
           (recheckGoogleSync)="calendarStore.checkGoogleConnection()"
           (reloadReport)="onReloadReport()"
           (reloadProjects)="onReloadProjects()"
           (editStart)="dashboardStore.startEditing()"
           (editCancel)="dashboardStore.cancelEditing()"
           (editReset)="dashboardStore.resetDraft()"
           (editSave)="dashboardStore.saveLayout({})"
           (draftLayoutChange)="dashboardStore.updateDraft($event)"/>
