<omcd-page-header title="Calendar" [crumbs]="crumbs"/>

<div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_340px] gap-6 items-start">
    <section class="omcd-card min-w-0">
        <div class="omcd-card-header">
            <div>
                <h2 class="omcd-card-title">Schedule</h2>
                <p class="omcd-card-subtitle m-0">Select a day or a time range to add an event</p>
            </div>
            <p-button label="New event" icon="pi pi-plus" (onClick)="onAddEvent()"/>
        </div>
        <div class="px-6 pb-6">
            <calendar-view [events]="$events()"
                           (rangeChange)="onRangeChange($event)"
                           (slotSelected)="onSlotSelected($event)"
                           (eventSelected)="onEventSelected($event)"></calendar-view>
        </div>
    </section>

    <upcoming-events [events]="$upcomingEvents()"
                     (editEvent)="onEditEvent($event)"
                     (deleteEvent)="onDeleteEvent($event)"></upcoming-events>
</div>

<add-calendar-event [visible]="showAddEventComponent"
                    [event]="selectedEvent"
                    [prefillSelection]="prefillSelection"
                    (notify)="onDialogNotify()"
                    (deleteRequested)="onDeleteEvent($event)"></add-calendar-event>
<p-confirmDialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
