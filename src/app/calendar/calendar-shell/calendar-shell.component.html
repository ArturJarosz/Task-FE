<div class="flex flex-col gap-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0 m-0">Calendar</h1>
        <p-button label="Add event" icon="pi pi-plus" styleClass="p-button-outlined" (onClick)="onAddEvent()"></p-button>
    </div>
    <div class="flex flex-col lg:flex-row gap-4">
        <div class="lg:w-8/12 bg-surface-0 dark:bg-surface-900 rounded-xl border border-surface p-4">
            <calendar-view [events]="$events()"
                           (rangeChange)="onRangeChange($event)"
                           (slotSelected)="onSlotSelected($event)"
                           (eventSelected)="onEventSelected($event)"></calendar-view>
        </div>
        <div class="lg:w-4/12">
            <upcoming-events [events]="$upcomingEvents()"
                              (editEvent)="onEditEvent($event)"
                              (deleteEvent)="onDeleteEvent($event)"></upcoming-events>
        </div>
    </div>
</div>
<add-calendar-event [visible]="showAddEventComponent"
                     [event]="selectedEvent"
                     [prefillSelection]="prefillSelection"
                     (notify)="onDialogNotify()"
                     (deleteRequested)="onDeleteEvent($event)"></add-calendar-event>
<p-confirmDialog></p-confirmDialog>
