<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template pTemplate="header">
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">{{ header }}</span>
            <span class="text-sm text-gray-500">{{ event ? 'Change the name, time or description.' : 'Add a meeting, site visit or deadline.' }}</span>
        </div>
    </ng-template>
    <form [formGroup]="calendarEventForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="sm:col-span-2">
            <label for="name" class="omcd-form-label">Event name <span class="text-error-600">*</span></label>
            <input id="name" type="text" formControlName="name" pInputText class="w-full" placeholder="e.g. Site visit – Lublin 01"
                   (blur)="calendarEventForm.get('name')?.markAsDirty()"/>
            @if (isFieldInvalid('name')) {
                <small class="block mt-1.5 text-xs text-error-600">Enter an event name</small>
            }
        </div>
        <div class="sm:col-span-2 flex items-center gap-3">
            <p-toggleSwitch formControlName="allDay" inputId="allDay"/>
            <label for="allDay" class="text-sm font-medium text-gray-700">All day</label>
        </div>
        <div>
            <label for="startDateTime" class="omcd-form-label">Start <span class="text-error-600">*</span></label>
            <p-datePicker inputId="startDateTime" formControlName="startDateTime" dateFormat="dd.mm.yy"
                          [showTime]="!calendarEventForm.get('allDay')?.value" hourFormat="24" [showIcon]="true"
                          appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="endDateTime" class="omcd-form-label">End <span class="text-error-600">*</span></label>
            <p-datePicker inputId="endDateTime" formControlName="endDateTime" dateFormat="dd.mm.yy"
                          [showTime]="!calendarEventForm.get('allDay')?.value" hourFormat="24" [showIcon]="true"
                          appendTo="body" [fluid]="true"/>
        </div>
        @if (calendarEventForm.errors?.['endBeforeStart']) {
            <small class="sm:col-span-2 -mt-3 text-xs text-error-600">End must be after the start</small>
        }
        <div class="sm:col-span-2">
            <label for="description" class="omcd-form-label">Description</label>
            <textarea id="description" formControlName="description" pTextarea rows="3" [autoResize]="true" class="w-full"></textarea>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex flex-1 items-center justify-between gap-3">
            <div>
                @if (event) {
                    <p-button label="Delete event" icon="pi pi-trash" severity="secondary" [text]="true" (onClick)="onDelete()"/>
                }
            </div>
            <div class="flex items-center gap-3">
                <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
                <p-button [label]="event ? 'Save changes' : 'Create event'" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
            </div>
        </div>
    </ng-template>
</p-dialog>
