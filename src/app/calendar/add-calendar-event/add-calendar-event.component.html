<p-dialog closeAriaLabel="Close" [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">{{ title }}</span>
        </div>
    </ng-template>
    <form [formGroup]="calendarEventForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div class="sm:col-span-2">
            <label for="name" class="app-form-label">Event name <span class="text-error-600">*</span></label>
            <input id="name" type="text" formControlName="name" pInputText class="w-full" placeholder="e.g. Site visit – Lublin 01"
                   (blur)="calendarEventForm.get('name')?.markAsDirty()"/>
            @if (isFieldInvalid('name')) {
                <small class="block mt-1.5 text-xs text-error-600">Enter an event name</small>
            }
        </div>
        <div class="sm:col-span-2 flex items-center gap-3">
            <p-toggleswitch formControlName="allDay" inputId="allDay"/>
            <label for="allDay" class="text-sm font-medium text-gray-700">All day</label>
        </div>
        <div>
            <label for="startDateTime" class="app-form-label">Start <span class="text-error-600">*</span></label>
            <p-datepicker inputId="startDateTime" formControlName="startDateTime" dateFormat="dd.mm.yy"
                          [showTime]="!calendarEventForm.get('allDay')?.value" hourFormat="24" [showIcon]="true"
                          appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="endDateTime" class="app-form-label">End <span class="text-error-600">*</span></label>
            <p-datepicker inputId="endDateTime" formControlName="endDateTime" dateFormat="dd.mm.yy"
                          [showTime]="!calendarEventForm.get('allDay')?.value" hourFormat="24" [showIcon]="true"
                          appendTo="body" [fluid]="true"/>
        </div>
        @if (calendarEventForm.errors?.['endBeforeStart']) {
            <small class="sm:col-span-2 -mt-3 text-xs text-error-600">End must be after the start</small>
        }
        <div>
            <label for="eventClient" class="app-form-label">Client</label>
            <p-select inputId="eventClient" formControlName="clientId" [options]="clientOptions" optionLabel="name"
                      optionValue="id" [filter]="true" filterBy="name" [showClear]="true" placeholder="Select a client"
                      appendTo="body" [fluid]="true" (onChange)="onClientChange()"/>
        </div>
        <div>
            <label for="eventProject" class="app-form-label">Project</label>
            <p-select inputId="eventProject" formControlName="projectId" [options]="projectOptions" optionLabel="name"
                      optionValue="id" [filter]="true" filterBy="name" [showClear]="true" placeholder="Select a project"
                      appendTo="body" [fluid]="true" (onChange)="onProjectChange()"/>
        </div>
        <div class="sm:col-span-2">
            <label for="description" class="app-form-label">Description</label>
            <textarea id="description" formControlName="description" pTextarea rows="3" [autoResize]="true" class="w-full"></textarea>
        </div>
    </form>
    <ng-template #footer>
        <div class="flex flex-1 items-center justify-between gap-3">
            <div>
                @if (event) {
                    <p-button label="Delete event" icon="pi pi-trash" severity="secondary" [text]="true" (onClick)="onDelete()"/>
                }
            </div>
            <div class="flex items-center gap-3">
                <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
                <p-button [label]="event ? 'Save changes' : 'Create event'" (onClick)="onSave()"/>
            </div>
        </div>
    </ng-template>
</p-dialog>
