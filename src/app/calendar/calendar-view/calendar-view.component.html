<div class="app-calendar">
    <full-calendar [options]="calendarOptions"></full-calendar>
</div>
@if (tooltip(); as details) {
    <div role="tooltip" class="fixed z-[10000] flex flex-col gap-1 w-80 max-w-[calc(100vw-1rem)] p-3 rounded-lg bg-gray-800 text-white text-xs pointer-events-none"
         [style.left.px]="details.left" [style.top.px]="details.top" [style.bottom.px]="details.bottom">
        <div class="text-sm font-medium">{{ details.name }}</div>
        <div class="flex items-center gap-1.5"><i class="pi pi-clock text-xs" aria-hidden="true"></i>{{ details.when }}</div>
        @if (details.client) {
            <div class="flex items-center gap-1.5"><i class="pi pi-user text-xs" aria-hidden="true"></i>{{ details.client }}</div>
        }
        @if (details.project) {
            <div class="flex items-center gap-1.5"><i class="pi pi-folder text-xs" aria-hidden="true"></i>{{ details.project }}</div>
        }
        @if (details.description) {
            <div class="mt-1 line-clamp-4 whitespace-pre-line">{{ details.description }}</div>
        }
        @if (details.sync) {
            <div class="mt-1">{{ details.sync }}</div>
        }
    </div>
}
