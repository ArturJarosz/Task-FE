<header class="omcd-page-header">
    <h1 class="omcd-page-title">{{ title }}</h1>
    <nav aria-label="Breadcrumb">
        <ol class="flex flex-wrap items-center gap-1.5 list-none m-0 p-0 text-sm">
            <li *ngFor="let crumb of crumbs; let last = last" class="flex items-center gap-1.5">
                <a *ngIf="crumb.route && !last; else current" [routerLink]="crumb.route"
                   class="text-gray-500 no-underline hover:text-brand-500">{{ crumb.label }}</a>
                <ng-template #current><span class="text-gray-800" aria-current="page">{{ crumb.label }}</span></ng-template>
                <i *ngIf="!last" class="pi pi-angle-right text-xs text-gray-400" aria-hidden="true"></i>
            </li>
        </ol>
    </nav>
</header>
