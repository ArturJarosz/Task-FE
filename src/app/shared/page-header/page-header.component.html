<header class="app-page-header">
    <h1 class="app-page-title">{{ title }}</h1>
    <div class="flex flex-wrap items-center gap-4">
        <nav aria-label="Breadcrumb">
            <ol class="flex flex-wrap items-center gap-1.5 list-none m-0 p-0 text-sm">
                @for (crumb of crumbs; track $index; let last = $last) {
                    <li class="flex items-center gap-1.5">
                        @if (crumb.route && !last) {
                            <a [routerLink]="crumb.route"
                               class="text-gray-500 no-underline hover:text-brand-500">{{ crumb.label }}</a>
                        } @else {
                            <span class="text-gray-800" aria-current="page">{{ crumb.label }}</span>
                        }
                        @if (!last) {
                            <i class="pi pi-angle-right text-xs text-gray-400" aria-hidden="true"></i>
                        }
                    </li>
                }
            </ol>
        </nav>
        <!-- Page actions, e.g. the dashboard's "Customize dashboard" button -->
        <ng-content/>
    </div>
</header>
