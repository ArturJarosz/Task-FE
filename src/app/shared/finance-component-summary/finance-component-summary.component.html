<div class="flex flex-col gap-3 px-6" [class.pb-4]="addLabel" [class.pb-6]="!addLabel">
    <dl class="m-0 grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-px overflow-hidden rounded-xl border border-gray-200 bg-gray-200">
        @for (stat of stats; track stat.label) {
            <div class="bg-gray-50 px-4 py-3">
                <dt class="text-xs text-gray-500">{{ stat.label }}</dt>
                <dd class="m-0 mt-1 text-base font-semibold text-gray-800 tabular-nums whitespace-nowrap">
                    {{ stat.money ? ((stat.value ?? 0) | currency:'PLN':'symbol':'1.2-2') : (stat.value ?? 0) }}
                </dd>
                <!-- The average per item sits under its total, from two items on (with one it is the total) -->
                @if (showAverage && stat.money) {
                    <dd class="m-0 mt-0.5 text-xs text-gray-500 tabular-nums">
                        Average {{ (averages.get(stat.label) ?? 0) | currency:'PLN':'symbol':'1.2-2' }}
                    </dd>
                }
            </div>
        }
    </dl>
</div>
<!-- Under the figures, right above the table it adds to -->
@if (addLabel) {
    <div class="flex flex-wrap items-center justify-end gap-4 px-6 pb-4">
        <p-button [label]="addLabel" icon="pi pi-plus" (onClick)="add.emit()"/>
    </div>
}
<ng-content select="[wrapper-list]"></ng-content>
