<div class="bg-surface-0 dark:bg-surface-950 px-4 py-4 md:px-4 lg:px-4 card">
    <div class="flex flex-col lg:flex-row lg:justify-between items-center justify-center mb-4">
        <div class="flex items-start flex-col md:flex-row text-4xl">
            <div class="font-medium">{{ title }}</div>
            <div class="font-light text-surface-500 dark:text-surface-300" *ngIf="secondaryTitle">{{ secondaryTitle }}</div>
        </div>
        <div class="mt-6 lg:mt-0">
            <ng-content select="[wrapper-buttons]"></ng-content>
        </div>
    </div>
    <ng-content select="[wrapper-body]"></ng-content>
</div>
