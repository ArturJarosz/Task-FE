<section class="app-card overflow-hidden">
    <div class="app-card-header">
        <div>
            <h3 class="app-card-title">Tasks</h3>
            <p class="app-card-subtitle m-0">{{ taskCountLabel }}</p>
        </div>
        <p-button label="Add task" icon="pi pi-plus" (onClick)="onAddTask()"/>
    </div>
    <task-list
            [tasks]="tasks"
            [taskTypes]="$taskTypes()"
            [taskStatuses]="$taskStatuses()"
            [architects]="$architects()"
            [projectId]="projectId"
            [stageId]="stageId"
            (deleteTaskEVent)="onDelete($event)"/>
</section>
<add-task
        [visible]="showAddTaskComponent"
        [projectId]="projectId"
        [stageId]="stageId"
        (notify)="onNotify($event)"/>
