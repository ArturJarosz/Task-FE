<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [draggable]="false"
          [style]="{width: '700px'}" [breakpoints]="{'768px': '95vw'}" (onHide)="onClose()">
    <ng-template #header>
        <div class="flex flex-col gap-1">
            <span class="p-dialog-title">New task</span>
            <span class="text-sm text-gray-500">Add a piece of work to this stage and choose who does it.</span>
        </div>
    </ng-template>
    <form [formGroup]="addTaskForm" class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
            <label for="addTaskName" class="app-form-label">Task name <span class="text-error-600">*</span></label>
            <input id="addTaskName" type="text" formControlName="name" pInputText class="w-full" placeholder="e.g. Floor plan"
                   (blur)="markAsDirty('name')"/>
            @if (isFieldInvalid('name')) {
                <small class="block mt-1.5 text-xs text-error-600">Enter a task name</small>
            }
        </div>
        <div>
            <label for="addTaskType" class="app-form-label">Type <span class="text-error-600">*</span></label>
            <p-select inputId="addTaskType" formControlName="type" [options]="$taskTypes()"
                      optionLabel="label" optionValue="id" appendTo="body" [fluid]="true"/>
        </div>
        <div>
            <label for="addTaskArchitect" class="app-form-label">Architect <span class="text-error-600">*</span></label>
            <p-select inputId="addTaskArchitect" formControlName="architectId" [options]="$architectOptions()"
                      optionLabel="name" optionValue="id" [filter]="true" filterBy="name" placeholder="Select an architect"
                      appendTo="body" [fluid]="true"/>
            <small class="block mt-1.5 text-xs text-gray-500">Defaults to the project's architect</small>
        </div>
        <div class="sm:col-span-2">
            <label for="addTaskNote" class="app-form-label">Note</label>
            <textarea id="addTaskNote" formControlName="note" pTextarea rows="3" [autoResize]="true" class="w-full"></textarea>
        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="onCancel()"/>
        <p-button label="Create task" icon="pi pi-plus" [disabled]="!isSaveEnabled()" (onClick)="onSave()"/>
    </ng-template>
</p-dialog>
