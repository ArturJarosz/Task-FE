<section class="app-card mx-auto mt-12 max-w-lg p-8 text-center" aria-labelledby="logged-out-title">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-500">
        <i class="pi pi-sign-out text-xl" aria-hidden="true"></i>
    </div>

    <h1 id="logged-out-title" class="app-page-title mt-5">You have been logged out</h1>
    <p class="mt-2 text-gray-500">Log in again to get back to your projects.</p>
    <p class="mt-1 text-sm text-gray-500" aria-live="polite">
        Redirecting to the login page in {{ secondsLeft() }} s…
    </p>

    <div class="mt-6 flex justify-center">
        <p-button label="Log in again" icon="pi pi-sign-in" (onClick)="login()"/>
    </div>
</section>
