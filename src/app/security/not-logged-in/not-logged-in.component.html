<section class="app-card mx-auto mt-12 max-w-lg p-8 text-center sm:p-10" aria-labelledby="not-logged-in-title">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-500">
        <i class="pi pi-lock text-xl" aria-hidden="true"></i>
    </div>

    @if (sessionExpired) {
        <h1 id="not-logged-in-title" class="app-page-title mt-5">Your session has expired</h1>
        <p class="mt-2 text-gray-500">For your security you were signed out. Log in again to keep working.</p>
    } @else {
        <h1 id="not-logged-in-title" class="app-page-title mt-5">You are not logged in</h1>
        <p class="mt-2 text-gray-500">Sign in to see projects, clients and finances.</p>
    }
    <p class="mt-1 text-sm text-gray-500" aria-live="polite">
        Redirecting to the sign-in page in {{ secondsLeft() }}…
    </p>

    <div class="mt-6 flex justify-center">
        <p-button label="Log in now" icon="pi pi-sign-in" (onClick)="login()"/>
    </div>
</section>
