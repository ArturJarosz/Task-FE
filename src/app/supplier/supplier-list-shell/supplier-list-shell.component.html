<app-page-header title="Suppliers" [crumbs]="crumbs"/>

<div class="flex flex-col gap-6">
    <!-- KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-kpi-card icon="pi pi-truck" label="Suppliers">{{ $kpis().total }}</app-kpi-card>
        <app-kpi-card icon="pi pi-box" label="With supplies">{{ $kpis().withItems }}</app-kpi-card>
    </div>

    <!-- Table card -->
    <section class="app-card overflow-hidden">
        <div class="app-card-header">
            <div>
                <h2 class="app-card-title">All suppliers</h2>
                <p class="app-card-subtitle m-0">{{ $kpis().total }} {{ $kpis().total === 1 ? 'supplier' : 'suppliers' }}</p>
            </div>
            <p-button label="New supplier" icon="pi pi-plus" (onClick)="onAdd()"/>
        </div>
        <app-partner-list [rows]="$pagedRows()" routeBase="/suppliers" entityLabel="supplier" countLabel="Supplies"
                           icon="pi pi-truck" emptyText="Add the shops you buy materials and furniture from."
                           (deleteEvent)="onDelete($event)"/>
        <app-table-footer [total]="$rows().length" [page]="$page()" [pageSize]="pageSize"
                           (pageChange)="$page.set($event)"/>
    </section>
</div>

<p-confirmdialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
<add-supplier [visible]="showAdd" (notify)="onAddClosed()"></add-supplier>
