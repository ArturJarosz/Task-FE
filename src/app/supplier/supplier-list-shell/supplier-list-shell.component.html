<omcd-page-header title="Suppliers" [crumbs]="crumbs"/>

<div class="flex flex-col gap-6">
    <!-- KPIs -->
    <div class="grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-6">
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-truck text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">Suppliers</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().total }}</div>
            </div>
        </section>
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-box text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">With supplies</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().withItems }}</div>
            </div>
        </section>
    </div>

    <!-- Table card -->
    <section class="omcd-card overflow-hidden">
        <div class="omcd-card-header">
            <div>
                <h2 class="omcd-card-title">All suppliers</h2>
                <p class="omcd-card-subtitle m-0">{{ $kpis().total }} {{ $kpis().total === 1 ? 'supplier' : 'suppliers' }}</p>
            </div>
            <p-button label="New supplier" icon="pi pi-plus" (onClick)="onAdd()"/>
        </div>
        <omcd-partner-list [rows]="$pagedRows()" routeBase="/suppliers" entityLabel="supplier" countLabel="Supplies"
                           icon="pi pi-truck" emptyText="Add the shops you buy materials and furniture from."
                           (deleteEvent)="onDelete($event)"/>
        <omcd-table-footer [total]="$rows().length" [page]="$page()" [pageSize]="pageSize"
                           (pageChange)="$page.set($event)"/>
    </section>
</div>

<p-confirmDialog [style]="{width: '480px'}" [breakpoints]="{'640px': '95vw'}"/>
<add-supplier [visible]="showAdd" (notify)="onAddClosed()"></add-supplier>
