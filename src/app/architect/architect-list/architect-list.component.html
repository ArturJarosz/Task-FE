<p-table [value]="rows" [rowHover]="true" [tableStyle]="{'min-width': '40rem'}">
    <ng-template #header>
        <tr>
            <th>Architect</th>
            <th class="app-num">Projects</th>
            <th class="app-num">Active projects</th>
            <th class="app-num">Contract value</th>
            <th class="w-12"><span class="sr-only">Open</span></th>
        </tr>
    </ng-template>
    <ng-template #body let-row>
        <tr [routerLink]="['/architects', row.architect.id]" class="cursor-pointer">
            <td>
                <div class="flex items-center gap-3">
                    <span class="app-avatar bg-brand-50 text-brand-500">{{ getInitials(row.architect) }}</span>
                    <div class="min-w-0">
                        <div class="font-medium text-gray-800 truncate">{{ getName(row.architect) }}</div>
                        <div class="text-xs text-gray-500">Architect</div>
                    </div>
                </div>
            </td>
            <td class="app-num">{{ row.projects }}</td>
            <td class="app-num">{{ row.activeProjects }}</td>
            <td class="app-num">{{ row.value | currency:'PLN':'symbol':'1.2-2' }}</td>
            <td class="text-right text-gray-400"><i class="pi pi-angle-right" aria-hidden="true"></i></td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="5" class="p-0">
                <app-empty-state icon="pi pi-id-card" title="No architects yet"
                                  text="Architects show up here once they're added to the system."/>
            </td>
        </tr>
    </ng-template>
</p-table>
