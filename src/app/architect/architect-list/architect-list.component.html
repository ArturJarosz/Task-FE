<p-table [value]="rows" [rowHover]="true" tableStyleClass="sm:min-w-[40rem]"
         [lazy]="true" [lazyLoadOnInit]="false" (onLazyLoad)="onSort($event)">
    <ng-template #header>
        <tr>
            <th pSortableColumn="name">Architect <p-sortIcon field="name"/></th>
            <th pSortableColumn="projects" class="app-num max-sm:hidden">Projects <p-sortIcon field="projects"/></th>
            <th pSortableColumn="activeProjects" class="app-num max-sm:hidden">Active projects <p-sortIcon field="activeProjects"/></th>
            <th pSortableColumn="value" class="app-num max-sm:hidden">Contract value <p-sortIcon field="value"/></th>
        </tr>
    </ng-template>
    <ng-template #body let-row>
        <tr [routerLink]="['/architects', row.architect.id]" class="cursor-pointer">
            <td>
                <div class="flex items-center gap-3">
                    <span class="app-avatar bg-brand-50 text-brand-600">{{ getInitials(row.architect) }}</span>
                    <div class="min-w-0">
                        <div class="font-medium text-gray-800 truncate">{{ getName(row.architect) }}</div>
                        <div class="text-xs text-gray-500">Architect</div>
                    </div>
                </div>
            </td>
            <td class="app-num max-sm:hidden">{{ row.projects }}</td>
            <td class="app-num max-sm:hidden">{{ row.activeProjects }}</td>
            <td class="app-num max-sm:hidden">{{ row.value | currency:'PLN':'symbol':'1.2-2' }}</td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="4" class="p-0">
                <app-empty-state icon="pi pi-id-card" title="No architects yet"
                                  text="Architects show up here once they're added to the system."/>
            </td>
        </tr>
    </ng-template>
</p-table>
