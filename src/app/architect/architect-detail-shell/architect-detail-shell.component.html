@if ($architect(); as architect) {
    <architect-detail
                      [architect]="architect"
                      [projectsSummary]="$architectProjectsSummary()"
                      [projectTypes]="$projectTypes()"
                      [projectStatuses]="$projectStatuses()">
    </architect-detail>
} @else {
    @if ($architectLoadFailed()) {
        <app-load-error title="Couldn't load this architect" backLabel="Back to architects" [backRoute]="['/architects']"
                        (retry)="onRetry()"/>
    } @else {
        <div class="flex flex-col gap-gutter">
            <p-skeleton width="10rem" height="1.75rem"/>
            <div class="app-card flex items-center gap-5 p-6">
                <p-skeleton width="72px" height="72px" borderRadius="16px"/>
                <div class="flex flex-col gap-2 flex-1">
                    <p-skeleton width="16rem" height="1.5rem"/>
                    <p-skeleton width="12rem" height="1rem"/>
                </div>
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-[calc(75%_-_var(--spacing-gutter)/4)_minmax(0,1fr)] gap-gutter">
                <div class="app-card p-6"><p-skeleton height="12rem"/></div>
                <div class="app-card p-6"><p-skeleton height="12rem"/></div>
            </div>
        </div>
    }
}
