<wrapper [title]="this.pageTitle">
    <div wrapper-body>
        <p-accordion [multiple]="true" [value]="['0']">
            <form [formGroup]="architectDetailForm">
                <p-accordion-panel value="0">
                    <p-accordion-header>Parsonal details</p-accordion-header>
                    <p-accordion-content>
                    <div class="p-2">
                        <div class="grid grid-cols-12 gap-4 border-surface p-1" >
                            <div class="col-span-6 p-1 grid grid-cols-12 gap-4">
                                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">First name:</div>
                                <div class="col-span-8 pr-4">
                                    <input formControlName="firstName" pInputText>
                                </div>
                            </div>
                            <div class="col-span-6 p-1 grid grid-cols-12 gap-4">
                                <div class="col-span-4 text-surface-500 dark:text-surface-300 flex items-center">Last name:</div>
                                <div class="col-span-8 pr-4">
                                    <input formControlName="lastName" pInputText>
                                </div>
                            </div>
                        </div>
                    </div>
                    </p-accordion-content>
                </p-accordion-panel>
            </form>
        </p-accordion>
        <architect-projects-summary
                [architectProjectsSummary]="$architectProjectsSummary()"
                [projectStatuses]="this.projectStatuses"
                [projectTypes]="this.projectTypes"
        >
        </architect-projects-summary>
    </div>
</wrapper>
