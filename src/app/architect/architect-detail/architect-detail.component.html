<app-page-header title="Architect" [crumbs]="crumbs"/>

<div class="flex flex-col gap-gutter">
    <!-- Header card -->
    <section class="app-card app-detail-header">
        <div class="app-detail-icon bg-brand-50 text-brand-500 text-2xl font-semibold">
            {{ initials }}
        </div>
        <div class="flex-1 min-w-0">
            <h2 class="m-0 text-xl leading-[30px] font-semibold text-gray-800">{{ name }}</h2>
            <div class="app-detail-meta">
                <span>Architect</span>
                <span class="app-detail-meta-divider" aria-hidden="true"></span>
                <span>{{ projects }} {{ projects === 1 ? 'project' : 'projects' }}</span>
                <span class="app-detail-meta-divider" aria-hidden="true"></span>
                <span>{{ activeProjects }} active</span>
            </div>
        </div>
    </section>

    <div class="grid grid-cols-1 xl:grid-cols-[calc(75%_-_var(--spacing-gutter)/4)_minmax(0,1fr)] gap-gutter items-start">
        <!-- Main column -->
        <div class="min-w-0">
            <app-entity-projects [summary]="projectsSummary"
                                  [projectTypes]="projectTypes"
                                  [projectStatuses]="projectStatuses"
                                  emptyText="Projects show up here once this architect is assigned to one."/>
        </div>

        <!-- Side column -->
        <div class="flex flex-col gap-gutter">
            <section class="app-card">
                <div class="app-card-header">
                    <h3 class="app-card-title">Projects value</h3>
                </div>
                <div class="px-6 pb-6">
                    <span class="app-field-label">Total contract value</span>
                    <div class="app-kpi-value">
                        {{ projectsValue | currency:'PLN':'symbol':'1.2-2' }}
                    </div>
                </div>
            </section>

            <section class="app-card">
                <div class="app-card-header">
                    <h3 class="app-card-title">Details</h3>
                </div>
                <div class="grid grid-cols-2 gap-x-6 gap-y-5 px-6 pb-6">
                    <app-field label="First name" [value]="architect.firstName"/>
                    <app-field label="Last name" [value]="architect.lastName"/>
                    <app-field label="Added" [value]="architect.createdDateTime | date:'dd.MM.yyyy'"/>
                    <app-field label="Last updated" [value]="architect.lastModifiedDateTime | date:'dd.MM.yyyy'"/>
                </div>
            </section>
        </div>
    </div>
</div>
