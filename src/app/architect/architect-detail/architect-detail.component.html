<wrapper [title]="this.pageTitle">
    <div wrapper-body>
        <p-accordion [multiple]="true">
            <form [formGroup]="architectDetailForm">
                <p-accordionTab [selected]="true" header="Parsonal details" class="text-900 font-medium">
                    <div class="p-2">
                        <div class="grid grid-nogutter surface-border p-1" >
                            <div class="col-6 p-1 grid grid-nogutter">
                                <div class="col-4 text-500 flex align-items-center">First name:</div>
                                <div class="col-8 pr-3">
                                    <input formControlName="firstName" pInputText>
                                </div>
                            </div>
                            <div class="col-6 p-1 grid grid-nogutter">
                                <div class="col-4 text-500 flex align-items-center">Last name:</div>
                                <div class="col-8 pr-3">
                                    <input formControlName="lastName" pInputText>
                                </div>
                            </div>
                        </div>
                    </div>
                </p-accordionTab>
            </form>
        </p-accordion>
        <architect-projects-summary
                [architectProjectsSummary]="$architectProjectsSummary()"
                [projectStatuses]="this.projectStatuses"
                [projectTypes]="this.projectTypes"
        >
        </architect-projects-summary>
    </div>
</wrapper>
