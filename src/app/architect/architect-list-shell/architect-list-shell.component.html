<app-page-header title="Architects" [crumbs]="crumbs"/>

@if ($architectsLoadFailed()) {
    <app-load-error title="Couldn't load architects" text="Check your connection and try again." (retry)="onRetry()"/>
} @else {
    <div class="flex flex-col gap-6">
        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <app-kpi-card icon="pi pi-id-card" label="Architects">{{ $kpis().architects }}</app-kpi-card>
            <app-kpi-card icon="pi pi-briefcase" label="With active projects">{{ $kpis().withActiveProjects }}</app-kpi-card>
        </div>

        <!-- Table card -->
        <section class="app-card overflow-hidden">
            <div class="app-card-header">
                <div>
                    <h2 class="app-card-title">All architects</h2>
                    <p class="app-card-subtitle m-0">{{ $kpis().architects }} {{ $kpis().architects === 1 ? 'architect' : 'architects' }}</p>
                </div>
            </div>
            <architect-list [rows]="$pagedRows()"/>
            <app-table-footer [total]="$rows().length" [page]="$page()" [pageSize]="pageSize"
                               (pageChange)="$page.set($event)"/>
        </section>
    </div>
}
