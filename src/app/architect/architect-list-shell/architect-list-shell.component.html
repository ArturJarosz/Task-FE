<omcd-page-header title="Architects" [crumbs]="crumbs"/>

<div class="flex flex-col gap-6">
    <!-- KPIs -->
    <div class="grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-6">
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-id-card text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">Architects</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().architects }}</div>
            </div>
        </section>
        <section class="omcd-card flex items-center gap-4 p-5">
            <div class="omcd-kpi-icon"><i class="pi pi-briefcase text-xl"></i></div>
            <div>
                <div class="omcd-kpi-label">With active projects</div>
                <div class="text-2xl leading-8 font-bold text-gray-800 tabular-nums">{{ $kpis().withActiveProjects }}</div>
            </div>
        </section>
    </div>

    <!-- Table card -->
    <section class="omcd-card overflow-hidden">
        <div class="omcd-card-header">
            <div>
                <h2 class="omcd-card-title">All architects</h2>
                <p class="omcd-card-subtitle m-0">{{ $kpis().architects }} {{ $kpis().architects === 1 ? 'architect' : 'architects' }}</p>
            </div>
        </div>
        <architect-list [rows]="$pagedRows()"/>
        <omcd-table-footer [total]="$rows().length" [page]="$page()" [pageSize]="pageSize"
                           (pageChange)="$page.set($event)"/>
    </section>
</div>
